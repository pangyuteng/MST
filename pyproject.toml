[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "MST"
version = "0.0.1"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["."]
include = ["mst*"]
exclude = []

[tool.setuptools]
include-package-data = true